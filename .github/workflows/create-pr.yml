name: Test Create PR

on:
  push:
    branches:
      - develop


jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Run build tests
        run: |
          # Add your build and test commands here
          echo "Running build and tests..."

  create-pr:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated build update"
          branch: develop
          base: main
          title: "Automated PR from build to release"
          body: "This PR is automatically created from the build branch to the release branch after successful builds."
