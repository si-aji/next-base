name: Test Create PR

on:
  push:
    branches:
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Run build tests
        run: |
          # Add your build and test commands here
          echo "Running build and tests..."

  create-pr:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: |
          gh auth login --with-token

      - name: Create Pull Request
        run: |
          gh pr create --base main --head develop --title "Automated PR from develop to main" --body "This PR is automatically created from the develop branch to the main branch after successful builds."
